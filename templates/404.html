{% extends "base.html" %}
{% block title %} · Not found{% endblock %}

{% block content %}
<div class="panel mx-auto flex max-w-md flex-col items-center px-6 py-16 text-center">
  <span class="grid h-12 w-12 place-items-center rounded-2xl bg-accent/10 text-accent ring-1 ring-inset ring-accent/20">
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.6a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.6M12 16.8h.01"/>
    </svg>
  </span>
  <h1 class="mt-4 text-lg font-semibold text-ink">404 · Not found</h1>
  <p class="mt-1 text-sm text-muted">这个项目或事件不存在，可能已经被删除了。</p>
  <a href="{{ url_for('index') }}" class="btn btn-primary mt-6">
    <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
    Back to projects
  </a>
</div>
{% endblock %}
