{% extends "base.html" %}
{% block title %} · Not found{% endblock %}

{% block content %}
<div class="panel mx-auto flex max-w-md flex-col items-center px-6 py-14 text-center">
  <p class="label">HTTP 404</p>
  <h1 class="mt-3 font-display text-[24px] font-semibold tracking-tight text-ink">Not found</h1>
  <p class="mt-2 max-w-sm text-[13px] leading-relaxed text-muted">
    This project or event doesn't exist. It may have been deleted.
  </p>
  <a href="{{ url_for('index') }}" class="btn btn-primary mt-6">
    <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
    Back to projects
  </a>
</div>
{% endblock %}
